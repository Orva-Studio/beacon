name: release

# A v0.x.y tag (cut by `bun run release`) builds the Apple silicon app and publishes beacon-macos-arm64.dmg,
# checksums.txt and FFmpeg's source, configure patch and options (THIRD_PARTY_NOTICES promises them) as a GitHub
# release. Pull requests that change how it is built run everything but the publishing, as do such changes on main:
# GitHub shares only main's caches with other branches and tags, so main's runs keep the tools and Rust builds cached
# for them.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/build-tools.ts
      - packages/engine/speech/**
      - scripts/bundle-tools.ts
      - scripts/check-release.ts
      - packages/desktop/build-hook.ts
      - packages/desktop/icon.svg
      - packages/desktop/icon.iconset/**
      - packages/desktop/electrobun.config.ts
      - packages/desktop/package.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-tools.ts
      - packages/engine/speech/**
      - scripts/bundle-tools.ts
      - scripts/check-release.ts
      - packages/desktop/build-hook.ts
      - packages/desktop/icon.svg
      - packages/desktop/icon.iconset/**
      - packages/desktop/electrobun.config.ts
      - packages/desktop/package.json
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  macos-arm64:
    # macOS 26's SDK: beacon-speech uses its SpeechTranscriber.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: v
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" == v* && "$TAG" != "v$VERSION" ]]; then
            echo "tag $TAG doesn't match package.json's version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.4.2

      - name: pkg-config and cmake
        run: |
          command -v pkg-config || brew install pkgconf
          command -v cmake || brew install cmake

      - name: Cache Beacon's tools
        uses: actions/cache@v4.2.3
        with:
          path: |
            packages/engine/third-party/out
            packages/engine/third-party/src
          key: tools-macos-arm64-${{ hashFiles('scripts/build-tools.ts', 'packages/engine/speech/**') }}

      - name: Cache cargo
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/engine/target
          key: cargo-macos-arm64-${{ hashFiles('packages/engine/Cargo.lock', 'packages/engine/rust-toolchain.toml') }}

      # The runner image stopped shipping rustup at ~/.cargo/bin (October 2026), where the scripts call cargo; the
      # toolchain itself comes from packages/engine/rust-toolchain.toml.
      - name: Rust
        run: |
          if [ ! -x ~/.cargo/bin/cargo ]; then
            curl -sSf -o /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.0/aarch64-apple-darwin/rustup-init
            echo "aeb4105778ca1bd3c6b0e75768f581c656633cd51368fa61289b6a71696ac7e1  /tmp/rustup-init" | shasum -a 256 -c
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          fi
          cd packages/engine && ~/.cargo/bin/rustup toolchain install --no-self-update

      - run: bun install --frozen-lockfile

      # Known vulnerabilities in the pinned dependencies (bun audit), and the Rust crates' advisories and licences.
      - name: Audit
        run: |
          [ -x ~/.cargo/bin/cargo-deny ] || ~/.cargo/bin/cargo install cargo-deny --locked --version 0.20.2
          bun run audit

      - name: Build tools and engine
        run: bun run build

      # The Developer ID's certificate into a keychain of this run's own, its name for build-hook.ts to sign with
      # (hardened runtime). Without the secrets the app is signed ad hoc, as before (docs/security.md, "Developer ID").
      - name: Developer ID
        env:
          P12: ${{ secrets.BEACON_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.BEACON_DEVELOPER_ID_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no Developer ID secrets: signing ad hoc"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/beacon-signing.keychain-db"
          PASS=$(openssl rand -hex 16)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$ID" ]; then echo "the certificate has no Developer ID Application identity" >&2; exit 1; fi
          echo "BEACON_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          BEACON_RELEASE: ${{ startsWith(steps.v.outputs.tag, 'v') && '1' || '' }}
        run: bun run --cwd packages/desktop package

      - name: Collect
        run: |
          mkdir dist
          mv packages/desktop/artifacts/macos-arm64-Beacon.dmg dist/beacon-macos-arm64.dmg
          # What Check for Updates reads from the latest release.
          mv packages/desktop/artifacts/stable-macos-arm64-update.json packages/desktop/artifacts/stable-macos-arm64-Beacon.app.tar.zst dist/
          bun run build:tools --sources dist

      # Apple checks the signed DMG and its ticket is stapled to it, so it opens without a warning.
      - name: Notarize
        if: env.BEACON_SIGN_IDENTITY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun scripts/notarize.ts dist/beacon-macos-arm64.dmg

      - name: Checksums
        run: cd dist && shasum -a 256 * > checksums.txt && cat checksums.txt

      # The app installs an update only with Beacon's signature over it (packages/desktop/src/bun/update-signature.ts).
      - name: Sign the update
        if: startsWith(steps.v.outputs.tag, 'v')
        env:
          BEACON_UPDATE_KEY: ${{ secrets.BEACON_UPDATE_KEY }}
        run: |
          bun scripts/sign-update.ts dist
          cd dist && shasum -a 256 stable-macos-arm64-update.sig.json >> checksums.txt

      - name: Check the DMG
        run: bun scripts/check-release.ts dist/beacon-macos-arm64.dmg --version ${{ steps.v.outputs.version }}

      - name: Remove the signing keychain
        if: always() && env.BEACON_SIGN_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/beacon-signing.keychain-db" || true

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: beacon-macos-arm64
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(steps.v.outputs.tag, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Notes from the last published release, so a tag whose release failed doesn't hide its commits.
          PREV=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' || true)
          NOTES_ARGS=(--generate-notes)
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then NOTES_ARGS+=(--notes-start-tag "$PREV"); fi
          gh release create "$TAG" --title "$TAG" "${NOTES_ARGS[@]}" dist/*
