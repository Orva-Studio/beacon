name: Feature request
description: Something Beacon should do, or do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Beacon takes issues, not pull requests (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: "The task or problem, rather than the solution: what gets in the way today?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like Beacon to handle it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it now
      description: In Beacon or another editor (Camtasia, ScreenFlow, CapCut…), if you do.
