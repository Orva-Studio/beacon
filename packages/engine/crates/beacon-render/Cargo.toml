[package]
name = "beacon-render"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
beacon-media.workspace = true
beacon-decode.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=22.0.0"
core-graphics = "=0.25.0"
foreign-types = "=0.5.0"
core-foundation = "=0.10.1"
objc2 = "=0.6.5"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLTexture", "MTLResource", "MTLAllocation", "MTLTypes"] }
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSURL", "NSError", "NSObject", "NSArray"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMTime", "CMBase"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media", "objc2-core-video"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNRequest", "VNGeneratePersonSegmentationRequest", "VNRequestHandler", "VNObservation", "VNStatefulRequest", "VNTypes", "objc2-core-video"] }
