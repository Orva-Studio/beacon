[workspace]
resolver = "3"
members = ["crates/beacon-media", "crates/beacon-decode", "crates/beacon-ffi", "crates/beacon-render", "crates/beacon-worker"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
beacon-media = { path = "crates/beacon-media" }
beacon-decode = { path = "crates/beacon-decode" }
beacon-render = { path = "crates/beacon-render" }
wgpu = "=30.0.1"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"

[profile.release]
opt-level = 3
lto = true
